<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكاريزما | شاشة المنهج الدراسي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6; 
            color: #1e293b;
        }

        /* تنسيقات التابات العلوية (مطابقة للصورة) */
        .tab-btn {
            color: #64748b;
            font-weight: 700;
            padding-bottom: 0.75rem;
            position: relative;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        .tab-btn:hover { color: #3b82f6; }
        .tab-btn.active {
            color: #2563eb;
            font-weight: 900;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #2563eb;
            border-radius: 4px 4px 0 0;
        }

        /* تنسيقات القائمة الجانبية للدروس */
        .lesson-item {
            transition: all 0.2s;
            border-right: 4px solid transparent;
        }
        .lesson-item:hover { background-color: #f8fafc; }
        .lesson-item.active {
            background-color: #eff6ff;
            border-right-color: #3b82f6;
            color: #1e3a8a;
        }
        .lesson-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            background-color: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- الهيدر العلوي الفاتح -->
    <header class="bg-white border-b border-slate-200 py-3 px-6 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <img src="logo3.png" alt="لوجو الكاريزما" class="w-12 h-12 object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
            <div>
                <a href="dashboard.html" class="block text-lg font-black text-slate-800 hover:text-blue-600 transition-colors">منصة الكاريزما</a>
                <span id="headerPackageName" class="block text-xs text-slate-500 font-bold">جاري تحميل الباقة...</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-left hidden sm:block">
                <span class="block text-sm font-bold text-slate-800" id="headerStudentName">طالب الكاريزما</span>
                <span class="block text-[11px] text-emerald-600 font-bold bg-emerald-50 px-2 rounded border border-emerald-200 inline-block mt-0.5">طالب متميز</span>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border border-blue-200">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
    </header>

    <main class="max-w-[1500px] mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 md:p-6 flex-1 items-start">
        
        <!-- الجانب الأيمن: قائمة المحتويات والوحدات -->
        <aside class="lg:col-span-3 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col gap-4 sticky top-24 max-h-[85vh]">
            <h3 class="font-black text-slate-800 text-lg border-b border-slate-100 pb-2">المحتويات</h3>
            
            <!-- القائمة المنسدلة للوحدات -->
            <div>
                <select id="unitSelector" onchange="window.filterLessonsByUnit()" class="w-full bg-slate-50 border border-slate-300 text-slate-700 text-sm font-bold rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 outline-none cursor-pointer">
                    <option value="">جاري تحميل الوحدات...</option>
                </select>
            </div>

            <!-- قائمة الدروس -->
            <div id="lessonsContainer" class="space-y-1 overflow-y-auto flex-grow custom-scrollbar pr-1">
                <div class="text-center text-slate-400 text-xs py-8 font-bold">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i><br>جاري جلب المحتوى...
                </div>
            </div>
        </aside>

        <!-- الجانب الأيسر: مساحة العرض الرئيسية -->
        <div class="lg:col-span-9 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col min-h-[600px]">
            
            <!-- التابات العلوية (محاذاة لليمين مثل الصورة) -->
            <div id="lessonTabsContainer" class="flex items-center justify-start gap-8 border-b-2 border-slate-100 mb-6">
                <button onclick="window.switchTab('video')" id="tab-video" class="tab-btn active flex items-center gap-2">
                    <i id="icon-tab-video" class="fa-regular fa-circle-play text-blue-500"></i> فيديو الشرح
                </button>
                <button onclick="window.switchTab('summary')" id="tab-summary" class="tab-btn flex items-center gap-2">
                    <i id="icon-tab-summary" class="fa-regular fa-file-pdf text-blue-500"></i> مواد القراءة
                </button>
                <button onclick="window.switchTab('exam')" id="tab-exam" class="tab-btn flex items-center gap-2">
                    <i id="icon-tab-exam" class="fa-solid fa-list-check text-blue-500"></i> اختبار المعرفة
                </button>
            </div>

            <!-- 1. شاشة الانتظار -->
            <div id="content-waiting" class="flex-grow flex items-center justify-center">
                <div class="text-center text-slate-400">
                    <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100 shadow-inner">
                        <i class="fa-solid fa-book-open-reader text-4xl text-slate-300"></i>
                    </div>
                    <p class="font-bold text-xl text-slate-600 mb-1">اختر درساً للبدء</p>
                    <p class="text-sm">قم باختيار الوحدة ثم الدرس من القائمة الجانبية.</p>
                </div>
            </div>

            <!-- 2. محتوى الفيديو -->
            <div id="content-video" class="flex-grow hidden flex-col gap-4">
                <h2 id="currentLessonTitleVideo" class="text-xl font-black text-slate-800 mb-2">عنوان الدرس</h2>
                <div class="relative w-full pt-[56.25%] bg-black rounded-xl overflow-hidden shadow-lg border border-slate-200">
                    <div id="videoWrapperContainer" class="absolute top-0 left-0 w-full h-full flex items-center justify-center"></div>
                </div>
                <div class="flex justify-end mt-4">
                    <button onclick="window.markTaskCompleted('video')" id="btnMarkVideo" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm flex items-center gap-2 transition-all shadow-md">
                        <i class="fa-solid fa-check"></i> تحديد كمكتمل
                    </button>
                </div>
            </div>

            <!-- 3. محتوى مواد القراءة -->
            <div id="content-summary" class="flex-grow hidden flex-col gap-4">
                <h2 class="text-xl font-black text-slate-800 mb-2">المذكرة والمواد المقروءة</h2>
                <div id="pdfViewerContainer" class="w-full h-[600px] bg-slate-50 rounded-xl border border-slate-200 overflow-hidden flex items-center justify-center">
                    <!-- سيتم حقن الـ iframe هنا -->
                </div>
                <div class="flex justify-end mt-4">
                    <button onclick="window.markTaskCompleted('summary')" id="btnMarkSummary" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm flex items-center gap-2 transition-all shadow-md">
                        <i class="fa-solid fa-check"></i> لقد أتممت القراءة
                    </button>
                </div>
            </div>

            <!-- 4. محتوى الاختبار التفاعلي -->
            <div id="content-exam" class="flex-grow hidden flex-col gap-4">
                <h2 class="text-xl font-black text-slate-800 mb-2">اختبار إتمام الدرس</h2>
                <div id="examArea" class="bg-slate-50 border border-slate-200 rounded-xl p-6 flex-grow">
                    <div class="text-center text-slate-500 py-10 font-bold">جاري تحميل الاختبار...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- سكربت الفايربيس والمنطق -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMWv05C1AmAxFbDmZfzTRlZQTmKx3UmI8",
            authDomain: "omar-12-5e10c.firebaseapp.com",
            projectId: "omar-12-5e10c",
            storageBucket: "omar-12-5e10c.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        let currentPackageId = urlParams.get('packageId') || localStorage.getItem('selectedPackageId');
        
        let currentUserId = null;
        let userProgress = {}; 
        let allUnits = [];
        let allLessons = [];
        let activeLessonExams = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists()) {
                        document.getElementById('headerStudentName').innerText = userSnap.data().name || "طالب الكاريزما";
                        userProgress = userSnap.data().lessonProgress || {};
                    }
                } catch(e) {}
            }
            await fetchPackageData();
        });

        async function fetchPackageData() {
            if(!currentPackageId) return;
            
            try {
                // جلب اسم الباقة
                const pkgSnap = await getDoc(doc(db, "packages", currentPackageId));
                if(pkgSnap.exists()) document.getElementById('headerPackageName').innerText = pkgSnap.data().title;

                // جلب الوحدات
                const unitsSnap = await getDocs(query(collection(db, "units"), where("packageId", "==", currentPackageId)));
                const unitSelect = document.getElementById('unitSelector');
                unitSelect.innerHTML = '';
                allUnits = [];
                
                unitsSnap.forEach(u => {
                    allUnits.push({ id: u.id, name: u.data().unitName });
                    let opt = document.createElement('option');
                    opt.value = u.id;
                    opt.text = u.data().unitName;
                    unitSelect.appendChild(opt);
                });

                // جلب الدروس
                const lessonsSnap = await getDocs(query(collection(db, "lessons"), where("packageId", "==", currentPackageId)));
                allLessons = [];
                lessonsSnap.forEach(l => allLessons.push({ id: l.id, ...l.data() }));

                if(allUnits.length > 0) {
                    unitSelect.value = allUnits[0].id;
                    window.filterLessonsByUnit();
                } else {
                    unitSelect.innerHTML = '<option>لا توجد وحدات</option>';
                    document.getElementById('lessonsContainer').innerHTML = '<div class="text-center text-slate-400 py-8 font-bold">لا توجد دروس مضافة.</div>';
                }
            } catch(e) { console.error(e); }
        }

        window.filterLessonsByUnit = function() {
            const selectedUnitId = document.getElementById('unitSelector').value;
            const container = document.getElementById('lessonsContainer');
            container.innerHTML = '';

            const unitLessons = allLessons.filter(l => l.unitId === selectedUnitId);
            
            if(unitLessons.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-8 font-bold text-sm">لا توجد دروس في هذه الوحدة.</div>';
                return;
            }

            let isPreviousCompleted = true;

            unitLessons.forEach((lesson, index) => {
                let prog = userProgress[lesson.id] || {};
                let isFullyCompleted = prog.video && prog.summary && prog.exam;
                let isLocked = !isPreviousCompleted;

                let isActive = window.selectedLessonData?.id === lesson.id;

                let item = document.createElement('div');
                item.className = `lesson-item p-3 rounded-lg mb-2 font-bold text-sm flex items-center gap-3 cursor-pointer ${isActive ? 'active' : 'bg-slate-50 text-slate-600'} ${isLocked ? 'locked' : ''}`;
                
                let iconClass = isLocked ? 'fa-lock text-slate-400' : (isFullyCompleted ? 'fa-circle-check text-emerald-500' : 'fa-circle-play text-blue-500');

                item.innerHTML = `
                    <i class="fa-solid ${iconClass}"></i>
                    <span class="truncate w-full">${lesson.lessonTitle}</span>
                `;

                if(!isLocked) {
                    item.onclick = () => {
                        window.selectedLessonData = lesson;
                        window.filterLessonsByUnit(); 
                        window.loadLessonContent(lesson);
                    };
                }

                container.appendChild(item);
                // تم إيقاف القفل مؤقتاً لسهولة التجربة (احذف "|| true" لتفعيل القفل الإجباري)
                isPreviousCompleted = isFullyCompleted || true; 
            });
        }

        window.loadLessonContent = async function(lesson) {
            // إخفاء شاشة الانتظار
            document.getElementById('content-waiting').classList.add('hidden');
            document.getElementById('currentLessonTitleVideo').innerText = lesson.lessonTitle;

            // تحديث الفيديو
            const vidContainer = document.getElementById('videoWrapperContainer');
            if (lesson.videoUrl && (lesson.videoUrl.includes('youtube.com') || lesson.videoUrl.includes('youtu.be'))) {
                let embedUrl = lesson.videoUrl.replace('watch?v=', 'embed/').replace('youtu.be/', 'www.youtube.com/embed/').split('&')[0];
                vidContainer.innerHTML = `<iframe src="${embedUrl}?rel=0" class="absolute top-0 left-0 w-full h-full border-0" allowfullscreen></iframe>`;
            } else if (lesson.videoUrl) {
                vidContainer.innerHTML = `<video controls controlsList="nodownload" class="w-full h-full object-contain bg-black"><source src="${lesson.videoUrl}"></video>`;
            } else {
                vidContainer.innerHTML = `<span class="text-white font-bold">لا يوجد فيديو</span>`;
            }

            // تحديث الـ PDF
            const pdfContainer = document.getElementById('pdfViewerContainer');
            if(lesson.summaryUrl) {
                let safeUrl = encodeURIComponent(lesson.summaryUrl);
                pdfContainer.innerHTML = `<iframe src="https://docs.google.com/gview?url=${safeUrl}&embedded=true" class="w-full h-full border-0"></iframe>`;
            } else {
                pdfContainer.innerHTML = `<div class="text-slate-400 font-bold">لا توجد مواد مقروءة مرفقة.</div>`;
            }

            window.updateTabUI();

            // جلب الامتحان
            document.getElementById('examArea').innerHTML = '<div class="text-center text-slate-500 py-10 font-bold"><i class="fa-solid fa-spinner fa-spin"></i> جاري جلب الاختبار...</div>';
            activeLessonExams = [];
            try {
                const examSnap = await getDocs(query(collection(db, "exams"), where("lessonId", "==", lesson.id)));
                if(!examSnap.empty) {
                    activeLessonExams = examSnap.docs[0].data().questions || [];
                }
                window.renderExamUI();
            } catch(e) { console.error(e); }

            window.switchTab('video');
        }

        window.switchTab = function(tab) {
            ['video', 'summary', 'exam'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`content-${t}`).classList.remove('flex');
            });
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`content-${tab}`).classList.add('flex');
        }

        window.updateTabUI = function() {
            let prog = userProgress[window.selectedLessonData.id] || {};
            
            // تحديث الأيقونات في التابات (علامة الصح الخضراء)
            document.getElementById('icon-tab-video').className = prog.video ? 'fa-solid fa-circle-check text-emerald-500 text-lg' : 'fa-regular fa-circle-play text-blue-500 text-lg';
            document.getElementById('icon-tab-summary').className = prog.summary ? 'fa-solid fa-circle-check text-emerald-500 text-lg' : 'fa-regular fa-file-pdf text-blue-500 text-lg';
            document.getElementById('icon-tab-exam').className = prog.exam ? 'fa-solid fa-circle-check text-emerald-500 text-lg' : 'fa-solid fa-list-check text-blue-500 text-lg';

            // تحديث الأزرار السفلية
            const btnV = document.getElementById('btnMarkVideo');
            if(prog.video) { btnV.innerHTML = '<i class="fa-solid fa-check-double"></i> تمت المشاهدة'; btnV.className = 'bg-emerald-100 text-emerald-700 font-bold py-2.5 px-6 rounded-lg text-sm flex items-center gap-2 cursor-default'; }
            else { btnV.innerHTML = '<i class="fa-solid fa-check"></i> تحديد كمكتمل'; btnV.className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm flex items-center gap-2 transition-all shadow-md'; }

            const btnS = document.getElementById('btnMarkSummary');
            if(prog.summary) { btnS.innerHTML = '<i class="fa-solid fa-check-double"></i> تمت القراءة'; btnS.className = 'bg-emerald-100 text-emerald-700 font-bold py-2.5 px-6 rounded-lg text-sm flex items-center gap-2 cursor-default'; }
            else { btnS.innerHTML = '<i class="fa-solid fa-check"></i> لقد أتممت القراءة'; btnS.className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm flex items-center gap-2 transition-all shadow-md'; }
        }

        window.markTaskCompleted = async function(type) {
            if(!currentUserId || !window.selectedLessonData) return;
            
            if(!userProgress[window.selectedLessonData.id]) userProgress[window.selectedLessonData.id] = {};
            userProgress[window.selectedLessonData.id][type] = true;
            window.updateTabUI();
            window.filterLessonsByUnit();

            try {
                await updateDoc(doc(db, "users", currentUserId), {
                    [`lessonProgress.${window.selectedLessonData.id}.${type}`]: true
                });
            } catch(e) {}
        }

        window.renderExamUI = function() {
            const area = document.getElementById('examArea');
            if(activeLessonExams.length === 0) {
                area.innerHTML = '<div class="text-center text-slate-400 py-10 font-bold">لا يوجد اختبار متصل بهذا الدرس حالياً.</div>';
                window.markTaskCompleted('exam');
                return;
            }

            let prog = userProgress[window.selectedLessonData.id] || {};
            if(prog.exam) {
                area.innerHTML = `
                    <div class="text-center py-10">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl"><i class="fa-solid fa-check"></i></div>
                        <h3 class="text-xl font-bold text-slate-800">لقد اجتزت هذا الاختبار مسبقاً بنجاح!</h3>
                    </div>`;
                return;
            }

            let html = '<div class="space-y-6">';
            activeLessonExams.forEach((q, index) => {
                html += `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm quiz-question" data-correct="${q.correctAnswerIndex}">
                    <h3 class="font-bold text-slate-800 mb-4 text-base">${index + 1}. ${q.question}</h3>
                    <div class="space-y-2">
                        ${q.options.map((opt, oIdx) => `
                            <label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors">
                                <input type="radio" name="q_${index}" value="${oIdx}" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                                <span class="text-sm font-bold text-slate-700">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            });
            html += `
                <button onclick="window.submitExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm transition-all shadow-md mt-4 cursor-pointer">
                    تسليم الإجابات
                </button>
            </div>`;
            area.innerHTML = html;
        }

        window.submitExam = function() {
            const questions = document.querySelectorAll('.quiz-question');
            let score = 0;
            let allAnswered = true;

            questions.forEach((qBlock, idx) => {
                let selected = qBlock.querySelector(`input[name="q_${idx}"]:checked`);
                if(!selected) allAnswered = false;
                else {
                    if(parseInt(selected.value) === parseInt(qBlock.dataset.correct)) score++;
                }
            });

            if(!allAnswered) {
                alert("يرجى الإجابة على جميع الأسئلة أولاً!");
                return;
            }

            let percentage = (score / activeLessonExams.length) * 100;
            if(percentage >= 50) {
                alert(`ألف مبروك! لقد نجحت بنسبة ${percentage.toFixed(0)}%`);
                window.markTaskCompleted('exam');
                window.renderExamUI();
            } else {
                alert(`للأسف نسبتك ${percentage.toFixed(0)}%. يجب أن تحصل على 50% على الأقل للنجاح. أعد المحاولة.`);
            }
        }
    </script>
</body>
</html>
