<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكاريزما | تعيين كلمة مرور جديدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/90 border border-sky-400/30 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="font-black text-xl text-sky-400">منصة الكاريزما</h1>
            <p class="text-slate-400 text-xs mt-1">أدخل كلمة المرور الجديدة لحسابك</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs text-center font-bold"></div>

        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">كلمة المرور الجديدة</label>
                <input type="password" id="newPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-400" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-sky-400 hover:bg-sky-500 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg transition-all">
                تحديث كلمة المرور 🔐
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRVM5XsqU0VpteirIsHsudcumcm1v_lAk",
            authDomain: "omar-3fd07.firebaseapp.com",
            projectId: "omar-3fd07",
            storageBucket: "omar-3fd07.firebasestorage.app",
            messagingSenderId: "506303815561",
            appId: "1:506303815561:web:f615de9d8e096e870a0b58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const alertBox = document.getElementById('alertBox');
        
        // استخراج الكود (oobCode) الذي أرسله فايربيس في الرابط تلقائياً
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;

            try {
                // التحقق من صلاحية الكود ثم تغيير الباسورد فوراً
                await verifyPasswordResetCode(auth, oobCode);
                await confirmPasswordReset(auth, oobCode, newPassword);

                alertBox.className = "mb-4 p-3 rounded-xl text-xs text-center font-bold bg-emerald-500/20 border border-emerald-500 text-emerald-300";
                alertBox.textContent = "تم تغيير كلمة المرور بنجاح! جاري تحويلك لتسجيل الدخول...";
                alertBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {
                alertBox.className = "mb-4 p-3 rounded-xl text-xs text-center font-bold bg-rose-500/20 border border-rose-500 text-rose-300";
                alertBox.textContent = "انتهت صلاحية الرابط أو حدث خطأ. حاول طلب رابط جديد.";
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
