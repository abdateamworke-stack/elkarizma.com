<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإدارة | منصة الكاريزما</title>
    
    <!-- استدعاء خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            /* خلفية المنصة الرسمية */
            background-color: #070e27;
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 58, 138, 0.85)), 
                              url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            user-select: none;
        }

        /* أنيميشن الدخول */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

    <!-- حماية الواجهة -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
                return false;
            }
        };
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- حاوية الإشعارات -->
    <div id="alertBox" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300">
        <div class="bg-rose-600/90 backdrop-blur-md border border-rose-400 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            <span id="alertMsg" class="font-bold text-sm">كود المرور غير صحيح!</span>
        </div>
    </div>

    <!-- كارت تسجيل الدخول -->
    <div class="bg-slate-900/80 backdrop-blur-md border border-blue-500/30 rounded-[2rem] p-8 md:p-10 shadow-2xl w-full max-w-md animate-fade-up relative overflow-hidden">
        
        <!-- تأثيرات إضاءة في الخلفية -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-emerald-600/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 text-center flex flex-col items-center">
            
            <!-- اللوجو / الأيقونة -->
            <div class="w-20 h-20 bg-blue-950 border-2 border-blue-500 rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i class="fa-solid fa-shield-halved text-4xl text-blue-400"></i>
            </div>

            <h1 class="text-2xl md:text-3xl font-black text-white mb-2">بوابة الإدارة</h1>
            <p class="text-slate-400 text-sm font-semibold mb-8">منصة الكاريزما - مستر عمر درويش</p>

            <!-- حقل الباسوورد -->
            <div class="w-full relative mb-6">
                <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                    <i class="fa-solid fa-lock text-slate-500"></i>
                </div>
                <input type="password" id="adminCode" placeholder="أدخل الكود السري" 
                       class="w-full bg-slate-950/50 border-2 border-slate-700 focus:border-blue-500 rounded-xl py-3.5 pr-12 pl-4 text-white font-bold tracking-widest text-center outline-none transition-all placeholder-slate-600"
                       onkeydown="if(event.key === 'Enter') loginAdmin()">
            </div>

            <!-- زر الدخول -->
            <button onclick="loginAdmin()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all flex items-center justify-center gap-2 text-sm md:text-base cursor-pointer relative overflow-hidden group">
                <span class="relative z-10">تسجيل الدخول</span>
                <i class="fa-solid fa-arrow-left-to-bracket relative z-10"></i>
                <!-- تأثير اللمعان عند التمرير -->
                <div class="absolute inset-0 h-full w-0 bg-white/20 group-hover:w-full transition-all duration-300 ease-out z-0"></div>
            </button>
            
        </div>
    </div>

    <script>
        function loginAdmin() {
            const codeInput = document.getElementById('adminCode').value.trim();
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('alertBox');
            
            if (!codeInput) {
                showAlert('يرجى كتابة كود المرور أولاً!');
                return;
            }

            // تأثير التحميل
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحقق...`;
            btn.disabled = true;

            setTimeout(() => {
                // الكود السري الخاص بك
                if (codeInput === 'omar') {
                    // نجاح الدخول - توجيه لصفحة لوحة التحكم
                    window.location.href = 'admain2.html'; 
                } else {
                    // فشل الدخول
                    showAlert('❌ كود المرور غير صحيح!');
                    btn.innerHTML = `<span class="relative z-10">تسجيل الدخول</span> <i class="fa-solid fa-arrow-left-to-bracket relative z-10"></i>`;
                    btn.disabled = false;
                    document.getElementById('adminCode').value = '';
                    document.getElementById('adminCode').focus();
                }
            }, 800); // تأخير وهمي بسيط ليعطي إحساس بالتحقق الأمني
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alertBox');
            document.getElementById('alertMsg').innerText = msg;
            alertBox.classList.remove('hidden');
            alertBox.classList.add('animate-fade-up');
            
            setTimeout(() => {
                alertBox.classList.add('hidden');
                alertBox.classList.remove('animate-fade-up');
            }, 3000);
        }
    </script>
</body>
</html>
